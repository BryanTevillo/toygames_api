[package]
name = "toygames_api"
version = "0.1.0"
edition = "2024"

[dependencies]
# libreria para fechas y manejo de fechas 
chrono = { version = "0.4.34", features = ["serde"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# libreria para generacion de identificadores unicos
uuid = { version = "1.26.0", features = ["serde", "v4"] }

# libreria para base de datos las features son para que sqlx sepa que base de datos usar y con que runtime
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "chrono",
    "uuid",
] }
